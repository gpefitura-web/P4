name: fetch_template
on:
  workflow_dispatch:
  push:
    branches: [__BRANCH__]
    paths:
      - scripts/fetch_template.py
      - kit/revistas/**/fontes.yml
      - .github/workflows/fetch_template.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml
      - name: Baixar template
        run: python scripts/fetch_template.py
      - name: Commit
        run: |
          git config user.name "refs-bot"
          git config user.email "refs-bot@users.noreply.github.com"
          git add manuscrito/template
          git diff --cached --quiet || git commit -m "manuscrito: template da revista baixado"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep 5; done
